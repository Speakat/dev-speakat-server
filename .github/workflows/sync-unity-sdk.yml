name: Sync Unity SDK

on:
  push:
    branches: [main]
    paths:
      - 'SpeakatClient/SpeakatClient.cs'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server repo
        uses: actions/checkout@v4

      - name: Clone Unity SDK repo
        run: |
          git clone https://x-access-token:${{ secrets.SDK_REPO_TOKEN }}@github.com/Speakat/speakat-unity-sdk.git sdk-repo

      - name: Copy generated client
        run: cp SpeakatClient/SpeakatClient.cs sdk-repo/SpeakatClient.cs

      - name: Commit and push
        run: |
          cd sdk-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SpeakatClient.cs
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: sync SpeakatClient from server"
          git push
