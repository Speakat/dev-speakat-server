version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: speakat-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: speakat
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: speakat-redis
    ports:
      - "6379:6379"

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

volumes:
  mysql_data:
  redis_data: