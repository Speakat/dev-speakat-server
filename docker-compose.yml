version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: speakat-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: speakat
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: speakat-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
  redis_data: