global:
  scrape_interval: 30s
  evaluation_interval: 30s

# 앱 서버 메트릭은 Alloy remote_write 수신, 여기서는 모니터링 스택 자체만 수집
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
